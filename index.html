<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuit de Fer — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;color:#aab;font-family:ui-monospace,Menlo,Consolas,monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{width:min(100vw,calc((100vh - 48px) * 16 / 9));aspect-ratio:16/9;image-rendering:pixelated;background:#000;display:block;outline:none}

</style>

<body>
<canvas id="c" width="480" height="270" tabindex="0"></canvas>
<div id="help">
  <b>Solo</b> : <kbd>←↑↓→</kbd> ou <kbd>ZQSD</kbd> · <kbd>J</kbd> frapper (3 fois = combo) · <kbd>K</kbd> sauter (puis <kbd>J</kbd> : coup de pied) · <kbd>L</kbd> spécial · <kbd>P</kbd> pause<br>
  <b>En ligne</b> : mêmes touches, chacun sur son ordinateur (un joueur crée la partie, l'autre saisit le code)
</div>
<script>
(function () {
  var srcs = ['peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'], i = 0;
  window.peerSrc = '';
  function next() {
    if (typeof Peer !== 'undefined' || i >= srcs.length) return;
    var el = document.createElement('script'); el.src = srcs[i++];
    el.onload = function () { if (typeof Peer !== 'undefined') window.peerSrc = el.src; else next(); };
    el.onerror = next;
    document.head.appendChild(el);
  }
  next();
})();
</script>
<script>
'use strict';
/* ====================================================================
   NUIT DE FER — prototype d'un beat'em up à défilement horizontal
   3 héros, 1 niveau, 3 types d'ennemis, 1 boss, 1 ou 2 joueurs en local.
   ==================================================================== */
const W = 480, H = 270, LEN = 2400, Y0 = 158, Y1 = 254;
const cv = document.getElementById('c');
let g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
cv.addEventListener('pointerdown', () => { cv.focus(); unlockAudio(); });

/* ---------- entrées ---------- */
const ACT = ['left', 'right', 'up', 'down', 'punch', 'jump', 'special'];
const KEYS_SOLO = {
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  punch: ['KeyJ', 'KeyF', 'KeyZ'], jump: ['KeyK', 'KeyG', 'KeyX', 'Space'], special: ['KeyL', 'KeyH', 'KeyC']
};
const KEYS_P1 = { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], punch: ['KeyF'], jump: ['KeyG'], special: ['KeyH'] };
const KEYS_P2 = {
  left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
  punch: ['Comma', 'Numpad1'], jump: ['Period', 'Numpad2'], special: ['Slash', 'Numpad3']
};
const keys = {};
let nPlayers = 1;
const HLD = [{}, {}], PRS = [{}, {}], OLD = [{}, {}];
let START = false, PAUSE = false, oldS = false, oldP = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (state === 'online' && olStage === 'joining') {
    if (/^[a-zA-Z0-9]$/.test(e.key) && codeBuf.length < 5) codeBuf += e.key.toUpperCase();
    else if (e.key === 'Backspace') codeBuf = codeBuf.slice(0, -1);
  }
  unlockAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function gpFor(i) {
  const pads = (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).filter(Boolean);
  if (online) return i === localSlot ? pads[0] : undefined;
  return nPlayers === 1 ? pads[0] : pads[i];
}
function padHeld(gp, n) {
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  switch (n) {
    case 'left': return ax < -0.4 || b(14);
    case 'right': return ax > 0.4 || b(15);
    case 'up': return ay < -0.4 || b(12);
    case 'down': return ay > 0.4 || b(13);
    case 'punch': return b(2);
    case 'jump': return b(0);
    case 'special': return b(1) || b(3);
  }
  return false;
}
function poll() {
  for (let i = 0; i < 2; i++) {
    const sc = online ? (i === localSlot ? KEYS_SOLO : null) : (nPlayers === 1 ? (i === 0 ? KEYS_SOLO : null) : (i === 0 ? KEYS_P1 : KEYS_P2));
    const gp = gpFor(i);
    for (const n of ACT) {
      const h = (sc ? sc[n].some(k => keys[k]) : false) || (gp ? padHeld(gp, n) : false);
      PRS[i][n] = h && !OLD[i][n]; OLD[i][n] = h; HLD[i][n] = h;
    }
  }
  const gp0 = gpFor(online ? localSlot : 0);
  const s = !!(keys.Enter || (gp0 && gp0.buttons[9] && gp0.buttons[9].pressed));
  START = s && !oldS; oldS = s;
  const p = !!(keys.KeyP || keys.Escape || (gp0 && gp0.buttons[8] && gp0.buttons[8].pressed));
  PAUSE = p && !oldP; oldP = p;
}

/* ---------- audio (Web Audio, bruitages synthétiques) ---------- */
let AC = null;
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide) {
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(v || 0.05, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t); o.stop(t + d);
  } catch (e) { /* ignoré */ }
}
function noise(d, v) {
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (rng() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(), gn = AC.createGain();
    s.buffer = buf; gn.gain.value = v || 0.08;
    s.connect(gn); gn.connect(AC.destination); s.start();
  } catch (e) { /* ignoré */ }
}
const SFX = {
  hit() { noise(0.06, 0.1); tone(190, 0.06, 'square', 0.04, -90); },
  big() { noise(0.16, 0.16); tone(110, 0.16, 'sawtooth', 0.07, -70); },
  whoosh() { tone(420, 0.08, 'triangle', 0.03, -250); },
  jump() { tone(260, 0.12, 'square', 0.03, 220); },
  pick() { tone(660, 0.08, 'square', 0.04, 0); setTimeout(() => tone(990, 0.1, 'square', 0.04, 0), 70); },
  brk() { noise(0.2, 0.12); tone(140, 0.12, 'square', 0.04, -60); },
  special() { tone(300, 0.3, 'sawtooth', 0.05, 500); },
  ko() { tone(220, 0.4, 'sawtooth', 0.06, -170); },
  move() { tone(520, 0.04, 'square', 0.025, 0); }
};

/* ---------- données ---------- */
const T = {
  thug: { hp: 30, sp: 0.8, sc: 1, col: { shirt: '#b3412f', pants: '#3a3a52', skin: '#e0b090', hair: '#2a1a1a', acc: '#d4a017', shoe: '#1a1a1a' },
    atk: { reach: 22, dmg: 8, tele: 24, dur: 14, act: [5, 8] }, score: 100, name: 'VOYOU' },
  brute: { hp: 70, sp: 0.45, sc: 1.3, armor: true, col: { shirt: '#5a3a1a', pants: '#2f2f2f', skin: '#c99a74', hair: '#2a1a0a', acc: '#c9c9c9', shoe: '#111' },
    atk: { reach: 28, dmg: 16, tele: 38, dur: 22, act: [8, 12], kd: true }, score: 250, name: 'COSTAUD' },
  thrower: { hp: 24, sp: 0.7, sc: 1, ranged: true, col: { shirt: '#6a3fa0', pants: '#2a2a40', skin: '#e0b090', hair: '#4a9a3a', acc: '#66cc66', acc2: '#e8e8f0', shoe: '#dddddd' },
    atk: { reach: 22, dmg: 7, tele: 30, dur: 14, act: [5, 8] }, score: 150, name: 'LANCEUR' },
  boss: { hp: 220, sp: 1.0, sc: 1.4, armor: true, col: { shirt: '#26262e', pants: '#1a1a22', skin: '#d9a07a', hair: '#d02828', acc: '#d02828', shoe: '#111' },
    atk: { reach: 30, dmg: 10, tele: 22, dur: 16, act: [5, 8] }, score: 2000, name: 'LE CHEF' }
};
const ATK = [
  { dur: 15, act: [4, 7], reach: 24, dmg: 6, kd: false, ext: 10 },
  { dur: 15, act: [4, 7], reach: 26, dmg: 7, kd: false, ext: 12 },
  { dur: 24, act: [7, 10], reach: 30, dmg: 11, kd: true, ext: 15 }
];
const KICK = { reach: 24, dmg: 8, kd: false };
const HERO_KEYS = ['cogneur', 'vive', 'costaud'];
const HEROES = {
  cogneur: { name: 'LE COGNEUR', role: 'Équilibré', special: 'Tourbillon', sc: 1, hp: 100, spd: 1.5, jump: 4.4, dmg: 1, reach: 0, rate: 1, slam: 0,
    col: { shirt: '#2f6fd0', pants: '#3b4f8a', skin: '#e6b48c', hair: '#3a2418', acc: '#e03030', acc2: '#f2f2f2', shoe: '#f2f2f2' } },
  vive: { name: 'LA VIVE', role: 'Rapide', special: 'Roulade', sc: 1, hp: 80, spd: 1.95, jump: 4.9, dmg: 0.8, reach: 0, rate: 0.8, slam: 0,
    col: { shirt: '#2fb59a', pants: '#22222e', skin: '#e8b894', hair: '#e0a030', acc: '#f5d442', acc2: '#ffffff', shoe: '#f5f5f5' } },
  costaud: { name: 'LE COSTAUD', role: 'Lourd', special: 'Coup de masse', sc: 1.15, hp: 130, spd: 1.1, jump: 3.9, dmg: 1.45, reach: 4, rate: 1.25, slam: 14,
    col: { shirt: '#d9622b', pants: '#3b4036', skin: '#b07850', hair: '#1a1210', acc: '#d9a21b', shoe: '#2a2a2a' } }
};
for (const k of HERO_KEYS) {
  const h = HEROES[k];
  h.atk = ATK.map(a => ({
    dur: Math.round(a.dur * h.rate), act: a.act.map(x => Math.round(x * h.rate)), reach: a.reach + h.reach,
    dmg: Math.max(1, Math.round(a.dmg * h.dmg)), kd: a.kd, ext: a.ext + h.reach
  }));
  h.kick = { reach: KICK.reach + h.reach, dmg: Math.round(KICK.dmg * h.dmg), kd: false };
}
const LV = {
  barrels: [[330, 190], [760, 175], [1300, 222], [1650, 185]],
  waves: [
    { cam: 120, spawn: [['thug', 1], ['thug', -1]] },
    { cam: 560, spawn: [['thug', 1], ['thug', -1], ['thug', 1]] },
    { cam: 980, spawn: [['brute', 1], ['thug', -1]] },
    { cam: 1380, spawn: [['thrower', 1], ['thug', -1], ['thug', 1], ['thrower', -1]] },
    { cam: 1700, spawn: [['brute', 1], ['thrower', -1], ['thug', 1]] },
    { cam: 1920, boss: true, spawn: [['boss', 1]] }
  ]
};

/* ---------- état du jeu ---------- */
let state = 'title', PS = [], E = [], B = [], IT = [], PJ = [], FX = [];
let cam = 0, camLimit = LEN - W, waveI = 0, waveActive = false;
let hitstop = 0, shake = 0, tgt = null, tgtT = 0, goT = 0, tick = 0, endT = 0, paused = false, attackers = 0;
let menuIdx = 0, SEL = [{ c: 0, lock: false }, { c: 1, lock: false }], selT = 0;

let rngS = 1;
function seedRng(s) { rngS = (s >>> 0) || 1; }
function rng() {
  rngS = (rngS + 0x6D2B79F5) | 0;
  let t = Math.imul(rngS ^ (rngS >>> 15), 1 | rngS);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + rng() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function mkPlayer(hero, slot) {
  const hr = HEROES[hero];
  return { kind: 'p', hero, slot, x: 70 + slot * 26, y: 198 + slot * 26, z: 0, vx: 0, vy: 0, vz: 0, face: 1, hp: hr.hp, maxhp: hr.hp,
    st: 'free', t: 0, stage: 0, buf: false, kick: false, kt: 0, hit: new Set(), inv: 0, flash: 0, walk: 0, mv: false,
    dying: false, lie: 0, lives: 3, score: 0, cd: 0, out: false, refund: false };
}
function mkEnemy(type, x, y) {
  const d = T[type], hp = Math.round(d.hp * (nPlayers === 2 ? 1.5 : 1));
  return { kind: 'e', type, x, y, z: 0, vx: 0, vy: 0, vz: 0, face: -1, hp, maxhp: hp, st: 'move', t: 0,
    cool: rnd(20, 70), side: rng() < 0.5 ? -1 : 1, slot: rnd(0, 30), hit: new Set(), inv: 0, flash: 0, walk: 0,
    mode: 'punch', tele: 24, combo: 0, phase: 1, dying: false, gone: false, lie: 0, mv: false };
}
function startGame() {
  PS = SEL.slice(0, nPlayers).map((s, i) => mkPlayer(HERO_KEYS[s.c], i));
  E = []; PJ = []; FX = []; IT = [];
  B = LV.barrels.map(([x, y]) => ({ kind: 'b', x, y, z: 0, hp: 1, gone: false, flash: 0 }));
  cam = 0; camLimit = LEN - W; waveI = 0; waveActive = false;
  hitstop = 0; shake = 0; tgt = null; tgtT = 0; goT = 0; endT = 0; paused = false;
  seedRng(online ? netSeed : (Date.now() >>> 0));
  state = 'play';
}
function spawn(type, side) {
  const x = side > 0 ? cam + W + 16 : cam - 16;
  const e = mkEnemy(type, x, rnd(Y0 + 6, Y1 - 6));
  e.face = side > 0 ? -1 : 1;
  E.push(e);
  return e;
}
const livePlayers = () => PS.filter(p => !p.out && !p.dying);

/* ---------- combat ---------- */
function strike(att, a) {
  const x0 = att.x, x1 = att.x + att.face * a.reach;
  const lo = Math.min(x0, x1) - 5, hi = Math.max(x0, x1) + 5;
  const list = att.kind === 'p' ? E.concat(B) : livePlayers();
  for (const t of list) {
    if (t.gone || t.dying || att.hit.has(t)) continue;
    if (t.kind !== 'b' && (t.st === 'down' || t.inv > 0)) continue;
    if (t.x < lo || t.x > hi || Math.abs(t.y - att.y) > 13 || Math.abs(t.z - att.z) > 26) continue;
    att.hit.add(t);
    hurt(t, att, a, att.face);
  }
}
function strikeArea(att, a) {
  for (const t of E.concat(B)) {
    if (t.gone || t.dying || att.hit.has(t)) continue;
    if (t.kind !== 'b' && (t.st === 'down' || t.inv > 0)) continue;
    if (Math.abs(t.x - att.x) > a.r || Math.abs(t.y - att.y) > 22 || Math.abs(t.z - att.z) > 30) continue;
    att.hit.add(t);
    hurt(t, att, a, t.x >= att.x ? 1 : -1);
  }
}
function knock(t, dir) {
  t.st = 'down'; t.t = 0; t.vz = 3.4; t.vx = dir * 2.1; t.z = Math.max(t.z, 1); t.kick = false; t.lie = 0;
}
function hurt(t, att, a, dir) {
  if (t.kind === 'b') { breakBarrel(t); return; }
  t.hp -= a.dmg; t.flash = 8;
  hitstop = Math.max(hitstop, a.kd ? 6 : 3);
  FX.push({ x: t.x, y: t.y, z: t.z + 20, t: 0, life: a.kd ? 12 : 8, big: !!a.kd });
  if (a.kd) { shake = Math.max(shake, 6); SFX.big(); } else SFX.hit();
  if (att.kind === 'p') { att.score += 10; if (t.kind === 'e') { tgt = t; tgtT = 150; } }
  if (t.hp <= 0) {
    t.hp = 0; t.dying = true; knock(t, dir);
    if (t.kind === 'e' && att.kind === 'p') att.score += T[t.type].score;
    SFX.ko();
    return;
  }
  const armored = (t.kind === 'e' && T[t.type].armor && !a.kd && (t.st === 'tele' || t.st === 'attack' || t.st === 'charge')) ||
    (t.kind === 'p' && t.hero === 'costaud' && !a.kd && t.st === 'attack');
  if (armored) return;
  if (a.kd || t.z > 0) knock(t, dir);
  else { t.st = 'hurt'; t.t = 0; t.vx = dir * 1.4; t.hit = new Set(); }
}
function breakBarrel(b) {
  b.gone = true; SFX.brk();
  for (let i = 0; i < 5; i++) FX.push({ x: b.x + rnd(-6, 6), y: b.y, z: rnd(6, 18), t: 0, life: 14, big: false });
  const r = rng();
  if (r < 0.5) IT.push({ x: b.x, y: b.y, type: 'apple', heal: 20 });
  else if (r < 0.72) IT.push({ x: b.x, y: b.y, type: 'meat', heal: 45 });
}

/* ---------- joueurs ---------- */
function startAttack(p, stage) {
  p.st = 'attack'; p.stage = stage; p.t = 0; p.buf = false; p.hit = new Set(); SFX.whoosh();
}
function updPlayer(p) {
  const I = HLD[p.slot], Pp = PRS[p.slot], hr = HEROES[p.hero];
  if (p.inv > 0) p.inv--;
  if (p.flash > 0) p.flash--;
  if (p.cd > 0) p.cd--;
  p.mv = false;
  switch (p.st) {
    case 'free': {
      let dx = (I.right ? 1 : 0) - (I.left ? 1 : 0), dy = (I.down ? 1 : 0) - (I.up ? 1 : 0);
      if (dx && dy) { dx *= 0.8; dy *= 0.8; }
      p.x += dx * hr.spd; p.y += dy * hr.spd * 0.7;
      if (dx) p.face = dx > 0 ? 1 : -1;
      if (dx || dy) { p.mv = true; p.walk += 0.14 * hr.spd; }
      if (Pp.jump) { p.st = 'air'; p.vz = hr.jump; p.vx = dx * hr.spd; p.vy = dy * 0.8; p.kick = false; SFX.jump(); }
      else if (Pp.special) {
        if (p.hero === 'vive') {
          if (p.cd <= 0) { p.st = 'roll'; p.t = 0; p.hit = new Set(); p.inv = 24; p.vx = p.face * 3.4; p.cd = 50; SFX.whoosh(); }
        } else if (p.hp > 10) {
          p.hp -= p.hero === 'costaud' ? 10 : 8; p.st = 'special'; p.t = 0; p.hit = new Set(); p.inv = 26; p.refund = true; SFX.special();
        }
      } else if (Pp.punch) startAttack(p, 0);
      break;
    }
    case 'attack': {
      p.t++;
      const a = hr.atk[p.stage];
      if (Pp.punch) p.buf = true;
      if (p.t >= a.act[0] && p.t <= a.act[1]) strike(p, a);
      if (p.t >= a.dur) {
        if (p.buf && p.stage < 2) startAttack(p, p.stage + 1);
        else p.st = 'free';
      }
      break;
    }
    case 'air': {
      p.x += p.vx; p.y += p.vy; p.vz -= 0.22; p.z += p.vz;
      if (Pp.punch && !p.kick) { p.kick = true; p.kt = 0; p.hit = new Set(); SFX.whoosh(); }
      if (p.kick) { p.kt++; if (p.kt >= 2 && p.kt <= 18) strike(p, hr.kick); }
      if (p.z <= 0) { p.z = 0; p.st = 'free'; p.kick = false; p.vx = 0; p.vy = 0; }
      break;
    }
    case 'special': {
      p.t++;
      if (p.hero === 'costaud') {
        if (p.t === 12) {
          p.hit = new Set();
          strikeArea(p, { r: 56, dmg: hr.slam, kd: true });
          shake = Math.max(shake, 8); SFX.big();
          if (p.hit.size && p.refund) { p.hp = Math.min(p.maxhp, p.hp + 8); p.refund = false; }
        }
        if (p.t >= 32) p.st = 'free';
      } else {
        if (p.t === 10) p.hit = new Set();
        if ((p.t >= 4 && p.t <= 8) || (p.t >= 10 && p.t <= 16)) {
          const before = p.hit.size;
          strikeArea(p, { r: 40, dmg: 9, kd: p.t >= 10 });
          if (p.hit.size > before && p.refund) { p.hp = Math.min(p.maxhp, p.hp + 8); p.refund = false; }
        }
        if (p.t >= 26) p.st = 'free';
      }
      break;
    }
    case 'roll': {
      p.t++; p.x += p.vx; p.vx *= 0.96;
      strike(p, { reach: 16, dmg: 5, kd: false });
      if (p.t >= 24) p.st = 'free';
      break;
    }
    case 'hurt': {
      p.t++; p.x += p.vx; p.vx *= 0.8;
      if (p.t >= 16) p.st = 'free';
      break;
    }
    case 'down': {
      p.t++; p.x += p.vx; p.vx *= 0.97; p.vz -= 0.25; p.z += p.vz;
      if (p.z <= 0) { p.z = 0; p.vz = 0; p.vx *= 0.8; p.lie++; }
      if (p.z === 0 && p.lie > 40) {
        if (p.dying) {
          p.lives--;
          if (p.lives > 0) {
            p.hp = p.maxhp; p.dying = false; p.st = 'free'; p.inv = 120; p.x = cam + 40 + p.slot * 24; p.y = 205 + p.slot * 20; p.lie = 0;
          } else { p.out = true; }
        } else { p.st = 'free'; p.inv = 90; p.lie = 0; }
      }
      break;
    }
  }
  p.x = clamp(p.x, cam + 10, cam + W - 10);
  p.y = clamp(p.y, Y0, Y1);
  if (p.st !== 'down') {
    for (const it of IT) {

/* ---------- jeu en ligne : WebRTC (PeerJS) + synchronisation par échange des touches ----------

/* ---------- menus ---------- */

function initSelect() {
  SEL = [{ c: 0, lock: false }, { c: 1, lock: false }]; selT = 0; cam = 0;
}

  const s = SEL[i];
  const taken = SEL.slice(0, nPlayers).some((o, j) => j !== i && o.lock && o.c === s.c);
  if (!taken) { s.lock = true; SFX.pick(); return true; }
  return false;
}
function updSelect() {
  if (PAUSE) { if (online) { netClose(); netMsg = ''; } toTitle(); return; }
  const slots = online ? [localSlot] : (nPlayers === 2 ? [0, 1] : [0]);
  let changed = false;
  for (const i of slots) {
    const s = SEL[i];
    if (!s.lock) {
      if (PRS[i].left) { s.c = (s.c + 2) % 3; SFX.move(); changed = true; }
      if (PRS[i].right) { s.c = (s.c + 1) % 3; SFX.move(); changed = true; }
      if ((PRS[i].punch || PRS[i].jump) && tryLock(i)) changed = true;
    } else if (PRS[i].special) { s.lock = false; changed = true; }
  }
  if (START) { const f = slots.find(i => !SEL[i].lock); if (f !== undefined && tryLock(f)) changed = true; }
  if (changed && online) sendSel();
  if (SEL.slice(0, nPlayers).every(o => o.lock)) {
    selT++;
    if (selT > 14) {
      if (!online) startGame();
      else if (localSlot === 0) {
        const seed = (Math.random() * 4294967296) >>> 0;
        netSend({ t: 'start', seed, heroes: [HERO_KEYS[SEL[0].c], HERO_KEYS[SEL[1].c]] });
        beginOnline(seed);

  } else selT = 0;
}
function updOnline() {
  if (PAUSE) { netClose(); toTitle(); return; }
  if (olStage === 'menu') {
    if (PRS[0].up || PRS[0].down) { olIdx = 1 - olIdx; SFX.move(); }
    if (START || PRS[0].punch || PRS[0].jump) { unlockAudio(); if (olIdx === 0) hostGame(); else { olStage = 'joining'; codeBuf = ''; } }
  } else if (olStage === 'joining') {
    if (START && codeBuf.length >= 4) joinGame(codeBuf);
  } else if (olStage === 'error') {
    if (START) { olStage = 'menu'; netMsg = ''; }
  }
}

/* ---------- simulation d'une image de jeu (identique chez les deux joueurs en ligne) ---------- */
function simStep() {
  if (shake > 0) shake -= 0.5;
  if (tgtT > 0) tgtT--;
  if (goT > 0) goT--;
  if (hitstop > 0) { hitstop--; return; }

  attackers = 0;
  for (const e of E) if (!e.gone && (e.st === 'tele' || e.st === 'attack' || e.st === 'charge')) attackers++;

  for (const p of PS) if (!p.out) updPlayer(p);
  for (const e of E.slice()) if (!e.gone) { updEnemy(e); e.x = clamp(e.x, cam - 30, cam + W + 30); }
  separate();
  updProj();
  for (const f of FX) f.t++;
  FX = FX.filter(f => f.t < f.life);
  E = E.filter(e => !e.gone);
  B = B.filter(b => !b.gone);
  updWaves();

  const act = PS.filter(p => !p.out);
  if (!act.length) { state = 'over'; endT = 0; return; }
  const lead = Math.max(...act.map(p => p.x));
  cam = Math.min(camLimit, Math.max(cam, lead - W * 0.42));
  if (waveI >= LV.waves.length && !waveActive && endT > 0) {
    endT--;
    if (endT === 0) { state = 'win'; endT = 0; }
  }
}

/* ---------- boucle de mise à jour ---------- */
function step() {
  tick++;
  poll();
  if (state === 'title') {
    cam = 0;
    if (PRS[0].up) { menuIdx = (menuIdx + 1) % 2; SFX.move(); }
    if (PRS[0].down) { menuIdx = (menuIdx + 1) % 2; SFX.move(); }
    if (START || PRS[0].punch || PRS[0].jump) {
      unlockAudio(); netMsg = '';
      if (menuIdx === 1) { state = 'online'; olStage = 'menu'; olIdx = 0; SFX.pick(); }
      else { nPlayers = menuIdx + 1; initSelect(); state = 'select'; SFX.pick(); }
    }
    return;
  }
  if (state === 'online') { updOnline(); return; }
  if (state === 'select') { updSelect(); return; }
  if (state === 'over' || state === 'win') {
    if (endT === 0 && online) SEL.forEach(s => { s.lock = false; });
    endT++;
    const ls = online ? localSlot : 0;
    if (endT > 60 && (START || PRS[ls].punch)) {
      if (online) { state = 'select'; selT = 0; sendSel(); } else toTitle();
    }
    return;
  }
  if (online) {
    if (!netFrameReady()) return;
    applyNetInputs();
  } else {
    if (PAUSE) paused = !paused;
    if (paused) return;
  }
  simStep();
  if (online) netAfterFrame();

skyG.addColorStop(0, '#0e0b24'); skyG.addColorStop(1, '#43275a');

function drawBG(c) {

  g.fillStyle = '#f2e9c8'; g.beginPath(); g.arc(390, 42, 17, 0, 7); g.fill();
  g.fillStyle = '#d8cfa8'; g.fillRect(384, 38, 5, 4); g.fillRect(395, 48, 4, 3);
  // fond lointain

    const bh = 70 + hash(i + 500) * 60, bx = Math.round(i * 64 - cm);

    for (let j = 0, wy = 150 - bh + 8; wy < 140; j++, wy += 12) {
      for (let k = 0; k < 4; k++) {

        g.fillRect(bx + 6 + k * 14, wy, 7, 7);

  g.fillStyle = '#3c394a';
  for (let k = Math.floor(c / 48) - 1; k <= Math.floor((c + W) / 48) + 1; k++) g.fillRect(Math.round(k * 48 - c), 150, 1, 28);
  g.fillStyle = '#6a6678'; g.fillRect(0, 177, W, 2);
  g.fillStyle = '#2a2a36'; g.fillRect(0, 179, W, H - 179);
  g.fillStyle = '#7d7a58';

  }

    txt('LE CHEF', W / 2, H - 20, 10, '#f88', 'center');
    bar(W / 2 - 100, H - 14, 200, 8, boss.hp / boss.maxhp, '#d03030');
  }
  if (goT > 0 && waveI < LV.waves.length && ((tick >> 4) & 1)) txt('GO >>', W - 14, 60, 16, '#ffd34d', 'right');
  if (online && stallT > 20) txt('En attente de l\'autre joueur...', W / 2, 52, 10, '#ffd34d', 'center');
  if (online && desync) txt('DÉSYNCHRONISÉ : relancez la partie', W / 2, 64, 10, '#f66', 'center');
}

let PREV = null;
function drawTitle() {
  g.fillStyle = 'rgba(5,3,15,.55)'; g.fillRect(0, 0, W, H);
  txt('NUIT DE FER', W / 2, 82, 38, '#ffcf4a', 'center');
  txt('prototype · beat\'em up', W / 2, 102, 11, '#cbd', 'center');
  ['1 JOUEUR', 'EN LIGNE (2 ORDINATEURS)'].forEach((o, i) => {
    const on = i === menuIdx;
    txt((on ? '> ' : '  ') + o + (on ? ' <' : '  '), W / 2, 150 + i * 22, 13, on ? '#fff' : '#889', 'center');
  });
  if (netMsg) txt(netMsg, W / 2, 214, 10, '#f66', 'center');
  else if ((tick >> 5) & 1) txt('ENTRÉE pour valider', W / 2, 214, 10, '#cbd', 'center');
  txt('Haut / Bas : choisir', W / 2, 236, 9, '#aab', 'center');
}
function drawOnline() {
  g.fillStyle = 'rgba(5,3,15,.7)'; g.fillRect(0, 0, W, H);
  txt('JEU EN LIGNE', W / 2, 44, 22, '#ffcf4a', 'center');
  if (olStage === 'menu') {
    ['CRÉER UNE PARTIE', 'REJOINDRE UNE PARTIE'].forEach((o, i) => {
      const on = i === olIdx;
      txt((on ? '> ' : '  ') + o + (on ? ' <' : '  '), W / 2, 110 + i * 26, 15, on ? '#fff' : '#889', 'center');
    });
    txt('Chacun joue sur son ordinateur. Un joueur crée la partie', W / 2, 190, 9, '#aab', 'center');
    txt('et donne le code à l\'autre.', W / 2, 202, 9, '#aab', 'center');
    txt('P : retour', W / 2, 250, 9, '#889', 'center');
  } else if (olStage === 'hosting') {
    txt('Code de la partie', W / 2, 96, 12, '#cbd', 'center');
    txt(hostCode, W / 2, 140, 38, '#fff', 'center');
    txt('Donnez ce code à l\'autre joueur.', W / 2, 176, 10, '#aab', 'center');
    if ((tick >> 5) & 1) txt('En attente de l\'autre joueur...', W / 2, 210, 11, '#ffd34d', 'center');
    txt('P : annuler', W / 2, 250, 9, '#889', 'center');
  } else if (olStage === 'joining') {
    txt('Entrez le code de la partie', W / 2, 96, 12, '#cbd', 'center');
    txt((codeBuf + '_____').slice(0, 5).split('').join(' '), W / 2, 140, 34, '#fff', 'center');
    txt('ENTRÉE pour se connecter', W / 2, 190, 10, '#aab', 'center');
    txt('P : retour', W / 2, 250, 9, '#889', 'center');
  } else if (olStage === 'connecting') {
    if ((tick >> 5) & 1) txt('Connexion...', W / 2, 140, 14, '#ffd34d', 'center');
  } else if (olStage === 'error') {
    txt(netMsg, W / 2, 130, 11, '#f66', 'center');
    txt('ENTRÉE pour revenir', W / 2, 180, 10, '#aab', 'center');
  }
}
function drawSelect() {
  g.fillStyle = 'rgba(5,3,15,.78)'; g.fillRect(0, 0, W, H);
  txt(nPlayers === 2 ? 'CHOISISSEZ VOS HÉROS' : 'CHOISISSEZ VOTRE HÉROS', W / 2, 26, 15, '#ffcf4a', 'center');
  if (!PREV) PREV = HERO_KEYS.map((k, i) => Object.assign(mkPlayer(k, 0), { x: 80 + i * 160, y: 156 }));
  const c0 = cam; cam = 0;
  HERO_KEYS.forEach((k, i) => {
    const hr = HEROES[k], cx = 80 + i * 160, e = PREV[i];
    g.fillStyle = 'rgba(30,26,60,.92)'; g.fillRect(cx - 66, 40, 132, 176);
    g.strokeStyle = '#3a3670'; g.lineWidth = 1; g.strokeRect(cx - 65.5, 40.5, 131, 175);
    txt(hr.name, cx, 58, 11, '#fff', 'center');
    txt(hr.role, cx, 70, 9, '#9ab', 'center');
    const locked = SEL.slice(0, nPlayers).some(s => s.lock && s.c === i);
    if (locked) { e.st = 'attack'; e.stage = (tick >> 5) % 3; e.t = (tick >> 1) % hr.atk[e.stage].dur; } else { e.st = 'free'; e.t = 0; }
    drawChar(e);
    txt('PV', cx - 60, 177, 8, '#9ab'); bar(cx - 40, 171, 96, 5, hr.hp / 130, '#4ccf4c');
    txt('VIT', cx - 60, 188, 8, '#9ab'); bar(cx - 40, 182, 96, 5, hr.spd / 1.95, '#4aa8ff');
    txt('FOR', cx - 60, 199, 8, '#9ab'); bar(cx - 40, 193, 96, 5, hr.dmg / 1.45, '#e0663a');
    txt(hr.special, cx, 211, 8, '#fda', 'center');
  });
  cam = c0;
  for (let i = 0; i < nPlayers; i++) {
    const s = SEL[i], cx = 80 + s.c * 160, col = i ? '#ff9a3a' : '#4aa8ff';
    g.strokeStyle = col; g.lineWidth = 2;
    g.strokeRect(cx - 68 + i * 3, 38 + i * 3, 136 - i * 6, 180 - i * 6);
    txt('J' + (i + 1) + (online && i === localSlot ? ' (vous)' : ''), cx - 62 + i * 46, 36, 9, col);
    if (s.lock) txt('J' + (i + 1) + ' PRÊT', cx, 230 + i * 10, 9, col, 'center');
  }
  txt(online ? 'En ligne : la partie démarre quand les deux joueurs sont prêts' : 'Gauche / Droite : choisir · Frapper : valider · Spécial : annuler', W / 2, 262, 8, '#aab', 'center');
}
function endScores() {
  PS.forEach((p, i) => txt('J' + (i + 1) + (online && i === localSlot ? ' (vous)' : '') + '  ' + String(p.score).padStart(6, '0'), W / 2, 148 + i * 14, 12, i ? '#fb7' : '#8cf', 'center'));
}

function render() {
  g.save();
  if (shake > 0) g.translate(Math.round((Math.random() * 2 - 1) * shake * 0.5), Math.round((Math.random() * 2 - 1) * shake * 0.5));
  const menu = state === 'title' || state === 'select' || state === 'online';
  drawBG(menu ? tick * 0.5 : cam);
  if (!menu) {
    const list = [];
    for (const b of B) list.push([b.y, () => drawBarrel(b)]);
    for (const it of IT) list.push([it.y - 1, () => drawItem(it)]);
    for (const e of E) list.push([e.y, () => drawChar(e)]);
    for (const p of PS) if (!p.out) list.push([p.y, () => drawChar(p)]);
    for (const b of PJ) list.push([b.y, () => drawProj(b)]);
    list.sort((a, b) => a[0] - b[0]);
    for (const l of list) l[1]();
    for (const f of FX) drawFX(f);
  }
  g.restore();
  if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else if (state === 'online') drawOnline();
  else {
    hud();
    if (paused) {
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, W, H);
      txt('PAUSE', W / 2, H / 2, 24, '#fff', 'center');
    }
    if (state === 'over') {
      g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 0, W, H);
      txt('GAME OVER', W / 2, 112, 30, '#e04040', 'center');
      endScores();
      if (endT > 60) txt(online ? 'ENTRÉE pour rejouer (choix des héros)' : 'ENTRÉE pour revenir au titre', W / 2, 200, 11, '#cbd', 'center');
    }
    if (state === 'win') {
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, H);
      txt('NIVEAU TERMINÉ', W / 2, 112, 26, '#ffd34d', 'center');
      endScores();
      if (endT > 60) txt(online ? 'ENTRÉE pour rejouer (choix des héros)' : 'ENTRÉE pour revenir au titre', W / 2, 200, 11, '#cbd', 'center');
    }
  }
}

/* ---------- boucle principale (pas fixe à 60 Hz) ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
